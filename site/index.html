<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hytale effects viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>Hytale effects</h1>
        <nav id="tabs">
          <button data-tab="particles">Particles</button>
          <button data-tab="sounds">Sounds</button>
          <button data-tab="screen">Screen</button>
          <button data-tab="models">Models</button>
          <button data-tab="assets">Assets</button>
        </nav>
        <input id="search" type="search" placeholder="Search by name or folder" autocomplete="off" />
        <label><input id="show-hidden" type="checkbox" /> Show _Test and _Example</label>
        <p id="count"></p>
      </header>
      <nav id="list"></nav>
    </aside>
    <main>
      <section id="viewer">
        <div id="stage">
          <canvas id="canvas"></canvas>
          <img id="overlay" alt="" hidden />
        </div>
        <div id="controls">
          <button id="restart" title="Restart (R)">Restart</button>
          <button id="pause" title="Pause (Space)">Pause</button>
          <label>
            Speed
            <select id="speed">
              <option value="0.1">0.1x</option>
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="2">2x</option>
            </select>
          </label>
          <label><input id="grid" type="checkbox" checked /> Grid</label>
          <label>Background <input id="background" type="color" value="#1b1d22" /></label>
          <span id="stats"></span>
          <span class="hint">Drag: orbit. Shift-drag: pan. Wheel: zoom. Double-click: reset. Up/Down: next effect.</span>
        </div>
      </section>
      <section id="details"></section>
    </main>
    <aside id="related" hidden></aside>
    <script type="module" src="app.js"></script>
  </body>
</html>
